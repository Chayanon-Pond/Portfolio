<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf7ef"/><stop offset="1" stop-color="#cfeddb"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a8f4e"/><stop offset="1" stop-color="#3f6f38"/></linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="#f3f6f4"/>

  <!-- greenhouse scene -->
  <rect y="96" width="1600" height="904" fill="url(#sky)"/>
  <!-- roof trusses -->
  <g stroke="#a9cbb4" stroke-width="3" fill="none" opacity="0.8">
    <path d="M0 300 Q800 150 1600 300"/><path d="M0 360 Q800 220 1600 360"/>
    <line x1="260" y1="140" x2="260" y2="760"/><line x1="620" y1="120" x2="620" y2="760"/><line x1="980" y1="120" x2="980" y2="760"/><line x1="1340" y1="140" x2="1340" y2="760"/>
  </g>
  <!-- fan -->
  <g transform="translate(1470 470)" stroke="#8fb89b" stroke-width="4" fill="none"><circle r="70"/><path d="M0 0 L0 -60 M0 0 L52 30 M0 0 L-52 30"/></g>
  <!-- plant rows (perspective) -->
  <g>
    <rect y="560" width="1600" height="440" fill="url(#floor)"/>
    <g fill="#6fae5e"><polygon points="120,560 320,560 240,1000 -40,1000"/><polygon points="440,560 620,560 620,1000 360,1000"/><polygon points="760,560 940,560 1010,1000 720,1000"/><polygon points="1080,560 1280,560 1420,1000 1080,1000"/></g>
    <g fill="#8ecb6f" opacity="0.85"><polygon points="330,560 430,560 350,1000 230,1000"/><polygon points="630,560 750,560 715,1000 625,1000"/><polygon points="950,560 1070,560 1075,1000 1020,1000"/></g>
    <g fill="#c0552f" opacity="0.9"><polygon points="1290,560 1430,560 1600,980 1600,1000 1430,1000"/></g>
  </g>

  <!-- header -->
  <rect width="1600" height="96" fill="#ffffff"/>
  <text x="56" y="46" font-size="34" font-weight="800" fill="#1f3d2b">Greenhouse Overview</text>
  <text x="56" y="78" font-size="21" fill="#6b8a76">Digital Twin · 5 zones · status computed from live values vs setpoint</text>
  <rect x="1180" y="26" width="240" height="46" rx="10" fill="#f1f5f2" stroke="#d5e2d9" stroke-width="2"/><text x="1206" y="56" font-size="22" fill="#3f6f4e">All Zones (5)</text><path d="M1388 44 l10 10 l10 -10" stroke="#3f6f4e" stroke-width="3" fill="none"/>
  <rect x="1436" y="26" width="112" height="46" rx="10" fill="#22a15a"/><text x="1492" y="56" font-size="20" fill="#fff" text-anchor="middle">Expand</text>

  <!-- zone cards -->
  <!-- helper look: white rounded card with name, temp, humidity, status dot -->
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <!-- Zone A -->
    <g transform="translate(70 150)">
      <rect width="440" height="150" rx="16" fill="#ffffff" opacity="0.97"/><rect width="440" height="150" rx="16" fill="none" stroke="#e3ebe5" stroke-width="2"/>
      <text x="26" y="46" font-size="24" font-weight="700" fill="#1f3d2b">Zone A · Lettuce</text>
      <circle cx="410" cy="40" r="10" fill="#22c55e"/>
      <text x="26" y="104" font-size="34" font-weight="800" fill="#ef7d3a">22.4°</text>
      <text x="150" y="104" font-size="26" fill="#6b8a76">💧 36%</text>
      <text x="300" y="104" font-size="26" fill="#6b8a76">🌡 setpoint 22°</text>
    </g>
    <!-- Zone B (warning) -->
    <g transform="translate(560 150)">
      <rect width="440" height="150" rx="16" fill="#ffffff" opacity="0.97"/><rect width="440" height="150" rx="16" fill="none" stroke="#f0d9b0" stroke-width="2"/>
      <text x="26" y="46" font-size="24" font-weight="700" fill="#1f3d2b">Zone B · Tomato</text>
      <circle cx="410" cy="40" r="10" fill="#f59e0b"/><text x="384" y="46" font-size="16" fill="#b26a00">⚠2</text>
      <text x="26" y="104" font-size="34" font-weight="800" fill="#ef7d3a">25.1°</text>
      <text x="150" y="104" font-size="26" fill="#6b8a76">💧 41%</text>
      <text x="300" y="104" font-size="26" fill="#6b8a76">🌡 setpoint 23°</text>
    </g>
    <!-- Zone C -->
    <g transform="translate(1050 150)">
      <rect width="440" height="150" rx="16" fill="#ffffff" opacity="0.97"/><rect width="440" height="150" rx="16" fill="none" stroke="#e3ebe5" stroke-width="2"/>
      <text x="26" y="46" font-size="24" font-weight="700" fill="#1f3d2b">Zone C · Melon</text>
      <circle cx="410" cy="40" r="10" fill="#22c55e"/>
      <text x="26" y="104" font-size="34" font-weight="800" fill="#ef7d3a">23.1°</text>
      <text x="150" y="104" font-size="26" fill="#6b8a76">💧 31%</text>
      <text x="300" y="104" font-size="26" fill="#6b8a76">🌡 setpoint 23°</text>
    </g>
    <!-- Zone CM-1 (warning) -->
    <g transform="translate(315 330)">
      <rect width="440" height="150" rx="16" fill="#ffffff" opacity="0.97"/><rect width="440" height="150" rx="16" fill="none" stroke="#f0d9b0" stroke-width="2"/>
      <text x="26" y="46" font-size="24" font-weight="700" fill="#1f3d2b">Zone CM-1 · Strawberry</text>
      <circle cx="410" cy="40" r="10" fill="#f59e0b"/><text x="384" y="46" font-size="16" fill="#b26a00">⚠1</text>
      <text x="26" y="104" font-size="34" font-weight="800" fill="#3b82f6">18.7°</text>
      <text x="150" y="104" font-size="26" fill="#6b8a76">💧 38%</text>
      <text x="300" y="104" font-size="26" fill="#6b8a76">🌡 setpoint 20°</text>
    </g>
    <!-- Zone CM-2 -->
    <g transform="translate(805 330)">
      <rect width="440" height="150" rx="16" fill="#ffffff" opacity="0.97"/><rect width="440" height="150" rx="16" fill="none" stroke="#e3ebe5" stroke-width="2"/>
      <text x="26" y="46" font-size="24" font-weight="700" fill="#1f3d2b">Zone CM-2 · Kale</text>
      <circle cx="410" cy="40" r="10" fill="#22c55e"/>
      <text x="26" y="104" font-size="34" font-weight="800" fill="#ef7d3a">20.8°</text>
      <text x="150" y="104" font-size="26" fill="#6b8a76">💧 34%</text>
      <text x="300" y="104" font-size="26" fill="#6b8a76">🌡 setpoint 21°</text>
    </g>
  </g>
</svg>
