<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <!-- page background -->
  <rect width="1600" height="1000" fill="#ffffff"/>
  <rect y="92" width="1600" height="908" fill="#eef2ff"/>

  <!-- blue wave / brand blob bottom-right -->
  <path d="M1600 250 C1360 300 1300 560 1420 720 C1500 828 1600 860 1600 1000 L1600 250 Z" fill="#4263eb"/>
  <path d="M1600 360 C1430 400 1380 600 1470 760 C1520 850 1600 880 1600 1000 L1600 360 Z" fill="#3b5bdb" opacity="0.85"/>

  <!-- top nav -->
  <text x="72" y="60" font-size="40" font-weight="800" fill="#4263eb">Course<tspan fill="#2b3a8f">Flow</tspan></text>
  <text x="1210" y="58" font-size="24" font-weight="600" fill="#2b2f45">Our Courses</text>
  <rect x="1400" y="26" width="132" height="56" rx="12" fill="#3b5bdb"/>
  <text x="1466" y="62" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">Log in</text>
  <rect y="91" width="1600" height="2" fill="#e2e6f5"/>

  <!-- hero heading -->
  <g fill="#141428" font-weight="800" font-size="104" letter-spacing="-2">
    <text x="96" y="380">Best Virtual</text>
    <text x="96" y="500">Classroom</text>
    <text x="96" y="620">Software</text>
  </g>

  <!-- subtitle -->
  <g fill="#5b6072" font-size="30" font-weight="500">
    <text x="100" y="712">Welcome to CourseFlow — the one-stop online</text>
    <text x="100" y="756">class management system for all your needs.</text>
  </g>

  <!-- CTA button -->
  <rect x="100" y="812" width="322" height="86" rx="14" fill="#3b5bdb"/>
  <text x="261" y="866" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Explore Courses</text>

  <!-- abstract classroom illustration (right) -->
  <g transform="translate(1120 300)">
    <!-- monitor / class window -->
    <rect x="0" y="0" width="300" height="210" rx="18" fill="#ffffff" stroke="#c9d2f5" stroke-width="3"/>
    <circle cx="26" cy="26" r="7" fill="#ff6b6b"/><circle cx="50" cy="26" r="7" fill="#ffd166"/><circle cx="74" cy="26" r="7" fill="#4ade80"/>
    <rect x="26" y="58" width="150" height="16" rx="8" fill="#4263eb"/>
    <rect x="26" y="86" width="248" height="12" rx="6" fill="#e2e6f5"/>
    <rect x="26" y="110" width="210" height="12" rx="6" fill="#e2e6f5"/>
    <!-- play button -->
    <circle cx="150" cy="160" r="34" fill="#eef2ff" stroke="#4263eb" stroke-width="3"/>
    <path d="M141 145 L167 160 L141 175 Z" fill="#3b5bdb"/>
    <!-- little cards -->
    <rect x="40" y="248" width="120" height="86" rx="12" fill="#ffffff" stroke="#c9d2f5" stroke-width="2"/>
    <rect x="56" y="266" width="60" height="12" rx="6" fill="#4263eb"/>
    <rect x="56" y="288" width="88" height="9" rx="4" fill="#dfe4f6"/>
    <rect x="56" y="306" width="70" height="9" rx="4" fill="#dfe4f6"/>
    <rect x="184" y="248" width="120" height="86" rx="12" fill="#ffffff" stroke="#c9d2f5" stroke-width="2"/>
    <rect x="200" y="266" width="60" height="12" rx="6" fill="#22c55e"/>
    <rect x="200" y="288" width="88" height="9" rx="4" fill="#dfe4f6"/>
    <rect x="200" y="306" width="70" height="9" rx="4" fill="#dfe4f6"/>
    <!-- graduation cap accent -->
    <g transform="translate(232 150)" fill="#ffd166">
      <path d="M40 0 L80 18 L40 36 L0 18 Z"/>
      <path d="M40 40 C58 40 70 33 70 24 L70 22 L40 34 L10 22 L10 24 C10 33 22 40 40 40 Z"/>
    </g>
  </g>
</svg>
